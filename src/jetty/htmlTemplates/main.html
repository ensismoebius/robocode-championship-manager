<!-- begin:main -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campeonato de Robocode - Entrar</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
	<main>
		<h1>Campeonato de Robocode</h1>
		<p class="message">{message}</p>
		<form action="/" method="post">
			<fieldset>
				<legend>Se você já cadastrou seu time entre com o login e a senha</legend>
				<label for="login">Login</label>
				<input type="text" id="login" name="login" placeholder="Login" required="required" autofocus>
				<label for="password">Senha</label>
				<input type="password" id="password" name="password" placeholder="Senha" required="required">
				<br><br>
				<input type="submit" value="Entrar">
			</fieldset>
		</form>
		<p class="info">
			Ainda não tem login e senha? <a href="./robotEditor?action=new">Cadastre seu time</a>
		</p>
	</main>
</body>
</html>
<!-- end:main -->
