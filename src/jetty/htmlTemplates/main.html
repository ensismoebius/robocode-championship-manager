<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login e senha</title>
</head>
<body>
	<h1>{message}</h1>
	<form action="/" method="post">
		<fieldset>
			<legend>Se você já cadastrou seu time entre com o login a senha</legend>
			<input type="text" name="login" placeholder="Login" required="required">
			<br>
			<input type="password" name="password" placeholder="Senha" required="required">
			<br>
			<input type="submit" value="Entrar">
		</fieldset>
	</form>
	<p>
		Se você não tem um login e senha <a href="./robotEditor">clique aqui</a>
	</p>
</body>
</html>
<!-- end:main -->
