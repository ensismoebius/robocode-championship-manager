<!-- begin:main -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastre seu robô</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
	<main>
		<div class="topbar">
			<h1>Cadastro para o campeonato de Robocode</h1>
			<a href="./robotEditor?action=logout">Sair do sistema</a>
		</div>
		<p class="message">{message}</p>
		<form action="./robotEditor?action={action}" method="post" enctype="multipart/form-data">
			<fieldset>
				<legend>Dados de login - o mesmo login e senha podem ser usados por todos do time</legend>
				<label for="login">Login</label>
				<input type="text" id="login" name="login" value="{login}" placeholder="Login" required="required">
				<label for="password">Senha</label>
				<input type="password" id="password" name="password" placeholder="{passwordPlaceholder}" {passwordRequired}>
			</fieldset>

			<fieldset>
				<legend>Dados do time</legend>
				<label for="teamWarcry">Lema do time</label>
				<input type="text" id="teamWarcry" name="teamWarcry" value="{teamWarcry}" placeholder="Lema do time" maxlength="500" required="required">
				<label for="teamMusic">Música tema do time - arquivo .mp3 de no máximo 1MB</label>
				<input type="file" id="teamMusic" name="teamMusic" accept=".mp3,audio/mpeg" {fileRequired}>
				<label for="teamLogo">Logotipo do time - no máximo 640 x 480 pixels e 1MB, em .gif, .jpg ou .png</label>
				<input type="file" id="teamLogo" name="teamLogo" accept=".gif,.jpg,.jpeg,.png,image/*" {fileRequired}>
			</fieldset>

			<fieldset>
				<legend>Quem desenvolveu (mínimo uma pessoa)</legend>
				<div id="devFields">
					<!-- begin:author -->
					<div class="author">
						<input type="text" name="name[]" value="{name}" placeholder="Nome" required="required">
						<input type="email" name="email[]" value="{email}" placeholder="E-mail" required="required">
					</div>
					<!-- end:author -->
				</div>
				<br>
				<button type="button" onclick="addDeveloperFields()">+ Adicionar pessoa</button>
			</fieldset>

			<fieldset>
				<legend>Dados do robô</legend>
				<p class="info">{robotInfo}</p>
				<label for="robotJarFile">Robô compilado: o arquivo .jar gerado pelo empacotador do Robocode</label>
				<input type="file" id="robotJarFile" name="robotJarFile" accept=".jar" {fileRequired}>
				<label for="robotJavaFile">Código fonte do robô: o arquivo .java</label>
				<input type="file" id="robotJavaFile" name="robotJavaFile" accept=".java" {fileRequired}>
			</fieldset>

			<input type="submit" value="{submitButton}" {submitDisabled}>
		</form>
	</main>

	<script>
		function addDeveloperFields() {
			let row = document.createElement("div");
			row.className = "author";

			let inputName = document.createElement("input");
			inputName.name = "name[]";
			inputName.type = "text";
			inputName.placeholder = "Nome";
			inputName.required = true;

			let inputEmail = document.createElement("input");
			inputEmail.name = "email[]";
			inputEmail.type = "email";
			inputEmail.placeholder = "E-mail";
			inputEmail.required = true;

			row.appendChild(inputName);
			row.appendChild(inputEmail);
			document.getElementById("devFields").appendChild(row);
		}
	</script>
</body>
</html>
<!-- end:main -->
