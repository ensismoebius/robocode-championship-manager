<!-- begin:main -->
<html>
<head>
<title>Cadastre seu robo aqui</title>
<meta charset="utf-8">
</head>
<body>
	<h1>{message}</h1>
	<form action="./robotEditor" method="post" enctype="multipart/form-data">
		<h1>Cadastro para o campeonato de Robocode</h1>
		<fieldset>
			<legend>Dados de login</legend>
			<input type="text" name="login" value="{login}" placeholder="Login" required="required">
			<input type="password" name="password" value="{password}" placeholder="Senha" required="required">
		</fieldset>

		<fieldset>
			<legend>Dados do time</legend>
			<input type="text" name="teamName" value="{teamName}" placeholder="Nome do time" required="required">
			<br>
			<input type="text" name="teamWarcry" value="{teamWarcry}" placeholder="Lema do time" required="required">
			<br> <br>
			<label for="teamMusic">Musica tema do time - Tamanho maximo de 1MB em formato mp3</label>
			<br>
			<input type="file" name="teamMusic" placeholder="Musica tema do time (Tamanho maximo 1MB em mp3)" required="required">
			<br> <br>
			<label for="teamLogo">Logotipo do time - Tamanho maximo de 1MB em formato .gif, .jpg, ou .png</label>
			<br>
			<input type="file" name="teamLogo" placeholder="Logotipo do time (.gif, .jpg ou .jpg)" required="required">
			<br>
		</fieldset>

		<fieldset>
			<legend>Dados de quem desenvolveu (minimo uma pessoa)</legend>
			<div id="devFields">
				<!-- begin:author -->
				<input type="text" name="name[]" value="{name}" placeholder="Nome" required="required">
				<input type="email" name="email[]" value="{email}" placeholder="E-mail" required="required"><br>
				<!-- end:author -->
			</div>
			<button onclick="return addDeveloperFields()">+ Adicionar</button>
		</fieldset>

		<fieldset>
			<legend>Dados do robô</legend>
			<input type="text" name="robotName" value="{robotName}" placeholder="Nome do robô" required="required">
			<br><br>
			<label for="robotJarFile">Arquivo do robô compilado, ou seja o arquivo .JAR</label>
			<br>
			<input type="file" name="robotJarFile" placeholder="Arquivo .jar do Robô" required="required">
			<br> <br>
			<label for="robotJavaFile">Código fonte do robô, ou seja o arquivo .JAVA</label>
			<br>
			<input type="file" name="robotJavaFile" placeholder="Arquivo .java do Robô" required="required">
		</fieldset>

		<input type="submit" value="Enviar">
	</form>

	<script>
		function addDeveloperFields() {
			let br = document.createElement("br");

			let inputName = document.createElement("input");
			inputName.name = "name[]";
			inputName.type = "text";
			inputName.placeholder = "Nome";

			let inputEmail = document.createElement("input");
			inputEmail.name = "email[]";
			inputEmail.type = "text";
			inputEmail.placeholder = "E-mail";

			document.getElementById("devFields").appendChild(br);
			document.getElementById("devFields").appendChild(inputName);
			document.getElementById("devFields").appendChild(inputEmail);
			return false;
		}
	</script>
</body>
</html>
<!-- end:main -->
