<!-- begin:main -->
<!DOCTYPE html>
<html>
<head>
<title>Cadastre seu robo aqui</title>
<meta charset="utf-8">
</head>
<body>
	<h1>{message}</h1>
	<a href="./robotEditor?action=logout">Sair do sistema</a>
	<form action="./robotEditor?action={action}" method="post" enctype="multipart/form-data">
		<h1>Cadastro para o campeonato de Robocode</h1>
		<fieldset>
			<legend>Dados de login - O mesmo login e senha poderá ser usado por todos do time</legend>
			<input type="text" name="login" value="{login}" placeholder="Login" required="required">
			<input type="password" name="password" placeholder="{passwordPlaceholder}" {passwordRequired}>
		</fieldset>

		<fieldset>
			<legend>Dados do time</legend>
			<input type="text" name="teamWarcry" value="{teamWarcry}" placeholder="Lema do time" maxlength="500" required="required">
			<br> <br>
			<label for="teamMusic">Musica tema do time - Tamanho maximo de 1MB em formato mp3</label>
			<br>
			<input type="file" id="teamMusic" name="teamMusic" accept=".mp3,audio/mpeg" {fileRequired}>
			<br> <br>
			<label for="teamLogo">Logotipo do time - Dimensões: 640 pixels de largura por 480 pixels de altura - Tamanho maximo de 1MB em formato .gif, .jpg, ou .png</label>
			<br>
			<input type="file" id="teamLogo" name="teamLogo" accept=".gif,.jpg,.jpeg,.png,image/*" {fileRequired}>
			<br>
		</fieldset>

		<fieldset>
			<legend>Dados de quem desenvolveu (minimo uma pessoa)</legend>
			<div id="devFields">
				<!-- begin:author -->
				<input type="text" name="name[]" value="{name}" placeholder="Nome" required="required">
				<input type="email" name="email[]" value="{email}" placeholder="E-mail" required="required"><br>
				<!-- end:author -->
			</div>
			<button type="button" onclick="addDeveloperFields()">+ Adicionar</button>
		</fieldset>

		<fieldset>
			<legend>Dados do robô</legend>
			<p>{robotInfo}</p>
			<label for="robotJarFile">Arquivo do robô compilado, ou seja o arquivo .JAR</label>
			<br>
			<input type="file" id="robotJarFile" name="robotJarFile" accept=".jar" {fileRequired}>
			<br> <br>
			<label for="robotJavaFile">Código fonte do robô, ou seja o arquivo .JAVA</label>
			<br>
			<input type="file" id="robotJavaFile" name="robotJavaFile" accept=".java" {fileRequired}>
		</fieldset>

		<input type="submit" value="{submitButton}" {submitDisabled}>
	</form>

	<script>
		function addDeveloperFields() {
			let br = document.createElement("br");

			let inputName = document.createElement("input");
			inputName.name = "name[]";
			inputName.type = "text";
			inputName.placeholder = "Nome";
			inputName.required = true;

			let inputEmail = document.createElement("input");
			inputEmail.name = "email[]";
			inputEmail.type = "email";
			inputEmail.placeholder = "E-mail";
			inputEmail.required = true;

			document.getElementById("devFields").appendChild(br);
			document.getElementById("devFields").appendChild(inputName);
			document.getElementById("devFields").appendChild(inputEmail);
		}
	</script>
</body>
</html>
<!-- end:main -->
