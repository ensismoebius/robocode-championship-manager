name: Installers

# Builds the installers. jpackage can not cross-build, so each system builds its own:
#   linux    -> packages for Ubuntu (.deb), Debian (.deb), Fedora (.rpm) and Arch (.pkg.tar.zst),
#               each built in the container of its distribution (packaging/build-linux-packages.sh)
#   windows  -> .exe
#   macos    -> .dmg (Apple Silicon)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the packages (Ubuntu, Debian, Fedora, Arch)
        run: sh packaging/build-linux-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/linux/*/*
          if-no-files-found: error

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install WiX Toolset (needed by jpackage for the .exe)
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y --no-progress

      - name: Build the installer (macOS, .dmg)
        if: runner.os == 'macOS'
        run: sh packaging/build-installer.sh dmg

      - name: Build the installer (Windows, .exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging\build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
